function formatTime(s) {
  if (!s || s < 0) s = 0;
  if (s < 60) return Math.floor(s) + "s";
  if (s < 3600) return Math.floor(s/60) + "m " + Math.floor(s%60) + "s";
  return Math.floor(s/3600) + "h " + Math.floor((s%3600)/60) + "m " + Math.floor(s%60) + "s";
}

function fmtDate(ts) {
  if (!ts) return "";
  var d = new Date(ts);
  return d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function getSaves() {
  try { var d = localStorage.getItem(SAVE_KEY); if (d) return JSON.parse(d); }

}

             roomsVisited: stats.roomsVisited || 1, jumps: stats.jumps || 0, 
             attacks: stats.attacks || 0, deaths: stats.deaths || 0 },
    timestamp: Date.now()
  };
  localStorage.setItem(SAVE_KEY, JSON.stringify(s));
}

function loadGame(i) {
  var s = getSaves().slots[i];
  if (!s) return false;
  currentRoom = s.room || 0;
  targetCamX = currentRoom * ROOM_W; cameraX = targetCamX;
  player.x = s.px; player.y = s.py; player.vx = 0; player.vy = 0;
  hasSword = s.hasSword || false; swordEquipped = s.swordEquipped || false;
  player.hasSword = hasSword; player.swordEquipped = swordEquipped;
  azari = s.azari || 0; hasMap = s.hasMap || false;
  player.hp = s.hp !== undefined ? s.hp : 10;
  player.maxHp = s.maxHp !== undefined ? s.maxHp : 10;
  twoPlayerMode = s.twoPlayer || false;
  heartFragments1 = s.heartFragments1 || 0;
  heartFragments2 = s.heartFragments2 || 0;
  heartFragmentsBought1 = s.heartFragmentsBought1 || 0;
  heartFragmentsBought2 = s.heartFragmentsBought2 || 0;
  hasAzariCharm = s.hasAzariCharm || false;
  hasDoubleJump = s.hasDoubleJump || false;
  if (hasDoubleJump) { player.maxJumps = 2; player2.maxJumps = 2; }
  if (s.bestiary) bestiary = JSON.parse(JSON.stringify(s.bestiary));
  if (s.stats) stats = { playTime: s.stats.playTime || 0, enemiesKilled: s.stats.enemiesKilled || 0, roomsVisited: s.stats.roomsVisited || 1, jumps: s.stats.jumps || 0, attacks: s.stats.attacks || 0, deaths: s.stats.deaths || 0 };
  if (s.enemiesKilled) {
    s.enemiesKilled.forEach(function(dead, idx){ if (enemies[idx]) enemies[idx].dead = dead; });
  }
  return true;
}

function deleteSave(i) {
  var s = getSaves(); s.slots[i] = null;
  localStorage.setItem(SAVE_KEY, JSON.stringify(s));
}

function spawnParticles(x, y, color, n, spd) {
  spd = spd || 3;
  for (var i = 0; i < n; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random()-0.5)*spd,
      vy: (Math.random()-0.5)*spd-1.5,
      life: 40+Math.random()*20,
      maxLife: 50,
      color: color,
      size: 2+Math.random()*3
    });
  }
}

function spawnFloatText(x, y, text, color) {
  floatTexts.push({x: x, y: y, text: text, color: color, life: 70, vy: -1.2});
}

function rectHit(a, b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function genDecor(off, nStal, nRock, roomH) {
  nStal = nStal || 10; nRock = nRock || 6; roomH = roomH || 600;
  var d = [];
  for (var i = 0; i < nStal; i++) {
    var x = off + 30 + Math.random() * (ROOM_W - 60);
    d.push({type:'stalactite', x: x, y: 0, w: 8+Math.random()*12, h: 15+Math.random()*40});
  }
  for (var i = 0; i < nRock; i++) {
    var x = off + Math.random() * ROOM_W;
    var h = 12 + Math.random() * 20;
    d.push({type:'rock', x: x, y: roomH-h, w: 20+Math.random()*35, h: h});
  }
  for (var i = 0; i < 4; i++) {
    d.push({type:'wall', x: off+Math.random()*ROOM_W, y: 80+Math.random()*250, w: 12+Math.random()*16, h: 30+Math.random()*60});
  }
  return d;
}

/* === AUDIO (simplificado) === */
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function playTone(freq, duration, type, vol, delay) {
  initAudio();
  if (!audioCtx || !sfxEnabled) return;
  try {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + duration);
  } catch(e) {}
}

function playNoise(duration, vol, delay) {
  initAudio();
  if (!audioCtx || !sfxEnabled) return;
  try {
    var bufferSize = Math.floor(audioCtx.sampleRate * duration);
    var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    var noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    var gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
    noise.connect(gain); gain.connect(audioCtx.destination);
    noise.start(audioCtx.currentTime + delay);
  } catch(e) {}
}

function playAmbientChord(baseFreq, delay) {
  if (!audioCtx || !musicPlaying) return;
  playTone(baseFreq, 3.5, "sine", 0.05, delay);
  playTone(baseFreq * 1.25, 3.2, "triangle", 0.03, delay + 0.1);
  playTone(baseFreq * 1.5, 2.8, "sine", 0.025, delay + 0.2);
  playTone(baseFreq * 2, 2.5, "sine", 0.02, delay + 0.3);
}

function startMusic() {
  initAudio();
  if (musicPlaying) return;
  musicPlaying = true;
  var chords = [82.41, 98, 110, 130.81, 110, 98, 82.41, 73.42];
  var chordIdx = 0;
  playAmbientChord(chords[chordIdx], 0);
  musicInterval = setInterval(function() {
    if (!musicPlaying) return;
    chordIdx = (chordIdx + 1) % chords.length;
    playAmbientChord(chords[chordIdx], 0);
  }, 3200);
}
function stopMusic() { musicPlaying = false; if (musicInterval) { clearInterval(musicInterval); musicInterval = null; } }
function toggleMusic() { initAudio(); if (musicPlaying) stopMusic(); else startMusic(); }
function toggleSfx() { sfxEnabled = !sfxEnabled; }

/* === PLAYER FUNCIONES === */
function playerTakeDamage(p, dmg) {
  if (p.inv > 0 || p.frozen) return;
  p.hp -= dmg;
  p.inv = 40;
  spawnParticles(p.x + p.w/2, p.y + p.h/2, "#f44", 10);
  flash = 0.4;
  sfxHit();
  if (p.hp <= 0) {
    p.hp = p.maxHp;
    stats.deaths++;
    playerDead = true;
    deathTimer = 60;
    sfxDeath();
    for (var i = 0; i < 30; i++) {
      deathParticles.push({
        x: p.x + p.w/2, y: p.y + p.h/2,
        vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8 - 3,
        life: 30 + Math.random() * 30, maxLife: 50,
        color: ["#f44", "#f88", "#f00", "#ff0"][Math.floor(Math.random()*4)],
        size: 3 + Math.random() * 4
      });
    }
    p.x = currentRoom * ROOM_W + 100 + (p.id === 2 ? 40 : 0);
    p.y = 400; p.vx = 0; p.vy = 0;
    spawnFloatText(p.x, p.y - 20, "¡J" + p.id + " cayó!", "#f44");
    spawnParticles(p.x + p.w/2, p.y + p.h/2, "#f00", 20, 5);
  }
}

function resetPlayer() {
  player.x = 100; player.y = 400; player.vx = 0; player.vy = 0;
  player.jumpsLeft = hasDoubleJump ? 2 : 1; player.facing = 1; player.inv = 0; player.autoWalk = 0;
  player.maxJumps = hasDoubleJump ? 2 : 1;

  player.swordSwing = 0; player.swordCooldown = 0;
  player.swordSheathed = true; player.swordSheathTimer = 0;
  playerDead = false;
  deathTimer = 0;
  particles = []; floatTexts = []; flash = 0;
  healing = false; healTimer = 0;
  hitFlash = 0; needsRespawn = false;
  if (twoPlayerMode) {
    player2.x = 140; player2.y = 400; player2.vx = 0; player2.vy = 0;
    player2.jumpsLeft = hasDoubleJump ? 2 : 1; player2.facing = 1; player2.inv = 0; player2.autoWalk = 0;

/* === UPDATE ENEMIES === */
function updateEnemies() {
  if (gameState !== ST_PLAYING) return;
  enemies.forEach(function(e) {
    if (e.dead || e.room !== currentRoom) return;
    var room = rooms[currentRoom];
    var left = currentRoom * ROOM_W, right = left + ROOM_W;
    if (e.type === 'larva_mosca') {
      var ecx = e.x + e.w/2, ecy = e.y + e.h/2;
      var pcx = player.x + player.w/2, pcy = player.y + player.h/2;
      var dx = pcx - ecx, dy = pcy - ecy;
      var dist = Math.sqrt(dx*dx + dy*dy);
      var target = player;
      if (twoPlayerMode) {
        var p2cx = player2.x + player2.w/2, p2cy = player2.y + player2.h/2;
        var d2x = p2cx - ecx, d2y = p2cy - ecy;
        var dist2 = Math.sqrt(d2x*d2x + d2y*d2y);
        if (dist2 < dist) { dist = dist2; dx = d2x; dy = d2y; target = player2; }
      }
      if (dist < e.visionRadius && !target.frozen && target.inv <= 0) {
        e.vx = (dx / dist) * e.speed;
        e.vy = (dy / dist) * e.speed;
      } else {
        e.vx *= 0.92; e.vy *= 0.92;
      }
      e.x += e.vx; e.y += e.vy;
      if (e.x < left + 10) { e.x = left + 10; e.vx *= -1; }
      if (e.x + e.w > right - 10) { e.x = right - 10 - e.w; e.vx *= -1; }
      if (e.y < 0) { e.y = 0; e.vy *= -1; }
      if (e.y + e.h > room.height - 10) { e.y = room.height - 10 - e.h; e.vy *= -1; }
    } else {
      e.x += e.vx;
      e.y = e.baseY + Math.sin(Date.now() / 400 + e.x * 0.01) * e.range * 0.3;
      if (e.x < left + 20 || e.x + e.w > right - 20) e.vx *= -1;
    }
    if (player.inv <= 0 && !player.frozen && rectHit(player, e)) {
      var dmg = e.type === 'larva_mosca' ? 2 : 1;
      playerTakeDamage(player, dmg);
    }
    if (twoPlayerMode && player2.inv <= 0 && !player2.frozen && rectHit(player2, e)) {
      var dmg2 = e.type === 'larva_mosca' ? 2 : 1;
      playerTakeDamage(player2, dmg2);
    }
  });
}

/* === GENERAR ESTALACTITAS === */
function generateStalactites() {
  stalactites = [];
  for (var i = 0; i < 15; i++) {
    stalactites.push({
      x: Math.random() * WORLD_W, y: -20 - Math.random() * 100,
      w: 6 + Math.random() * 10, h: 20 + Math.random() * 40,
      speed: 0.5 + Math.random() * 1.5,
      active: false, fallTimer: 100 + Math.random() * 400, fallen: false
    });
  }
}

function updateStalactites() {
  stalactites.forEach(function(s) {
    if (!s.active && !s.fallen) {
      s.fallTimer--;
      if (s.fallTimer <= 0) s.active = true;
    }
    if (s.active && !s.fallen) {
      s.y += s.speed;
      if (Math.random() < 0.1) spawnParticles(s.x + s.w/2, s.y, "rgba(100,100,120,0.3)", 1, 0.5);
      var roomIndex = Math.floor(s.x / ROOM_W);
      if (roomIndex < rooms.length) {
        var room = rooms[roomIndex];
        if (s.y + s.h >= room.height - 10) {
          s.fallen = true; s.active = false;
          spawnParticles(s.x + s.w/2, s.y + s.h, "#6a6a7a", 8, 4);
          spawnParticles(s.x + s.w/2, s.y + s.h, "#4a4a5a", 5, 3);
          sfxStalactiteFall();
        }
      }
    }
  });
  stalactites.forEach(function(s) {
    if (s.fallen) {
      s.fallTimer = 300 + Math.random() * 400;
      s.fallen = false;
      s.y = -20 - Math.random() * 100;
      s.x = Math.random() * WORLD_W;
      s.active = false;
    }
  });
}

/* === UPDATE GENERIC PLAYER === */
function updateGenericPlayer(p, moveLeft, moveRight, jumpPressed, attackPressed, interactPressed) {
  if (gameState !== ST_PLAYING) return;
  if (playerDead && p === player) {
    deathTimer--;
    if (deathTimer <= 0) { playerDead = false; p.inv = 40; }
    return;
  }
  if (p.autoWalk > 0 || p.frozen) { p.autoWalk--; return; }
  
  var wasOnGround = p.onGround;
  
  if (moveLeft) { p.vx = -3.5; p.facing = -1; }
  else if (moveRight) { p.vx = 3.5; p.facing = 1; }
  else p.vx *= 0.75;
  
  p.vy += GRAVITY; if (p.vy > 12) p.vy = 12;
  p.x += p.vx; p.y += p.vy;
  
  if (p.onGround && Math.abs(p.vx) > 1 && Math.random() < 0.3) {
    spawnParticles(p.x + p.w/2 + (p.facing > 0 ? 0 : p.w), p.y + p.h, "rgba(200,200,200,0.3)", 1, 0.5);
  }
  
  var left = 0, right = WORLD_W;
  if (p.x < left + 5) { p.x = left + 5; p.vx = 0; }
  if (p.x + p.w > right - 5) { p.x = right - 5 - p.w; p.vx = 0; }
  
  var newRoom = Math.floor(p.x / ROOM_W);
  if (newRoom >= rooms.length) newRoom = rooms.length - 1;
  if (newRoom !== currentRoom) {
    currentRoom = newRoom;
    stats.roomsVisited++;
    var names = ["CAVERNA INICIAL", "CUEVA OLVIDADA", "ASCENSO ROCOSO", "TÚNELES OLVIDADOS", "PROFUNDIDADES", "CIUDAD", "PICO ABISMAL", "CIMA", "CAMINO FINAL", "TIENDA"];
    zoneName = names[currentRoom] || "";
    zoneNameTimer = 120;
    p.inv = 30;
  }
  
  var room = rooms[currentRoom];
  if (p.y + p.h > room.height) {
    var hasFloor = false;
    for (var i = 0; i < room.platforms.length; i++) {
      var pl = room.platforms[i];
      if (pl.y + pl.h >= room.height - 5 && rectHit(p, pl)) { hasFloor = true; break; }
    }
    if (currentRoom === 2 && room2.bombBox && !room2.bombBox.broken) {
      var b = room2.bombBox;
      if (b.y + b.h >= room.height - 5 && rectHit(p, b)) hasFloor = true;
    }
    if (hasFloor) {
      p.y = room.height - p.h; p.vy = 0; p.onGround = true; p.jumpsLeft = p.maxJumps;
    }
  }
  if (p.y > room.height + 80) {
    if (currentRoom === 2 && room2.bombBox && room2.bombBox.exploded) { startFallTransition(); return; }
    if (currentRoom === 5) { startTransition(6, "forward"); return; }
    if (currentRoom < rooms.length - 1) { sfxFall(); startFallThroughTransition(currentRoom + 1); return; }
    p.x = currentRoom * ROOM_W + ROOM_W / 2 - p.w / 2 + (p.id === 2 ? 30 : -30);
    p.y = 100; p.vx = 0; p.vy = 0;
    spawnFloatText(p.x, p.y - 20, "¡No hay más abajo!", "#f44");
    return;
  }
  p.onGround = false;
  var touchingSpikes = false;
  
  room.platforms.forEach(function(pl) {
    if (rectHit(p, pl)) {
      if (p.vy >= 0 && p.y + p.h - p.vy <= pl.y + 10) {
        if (!wasOnGround && p.vy > 2) {
          spawnParticles(p.x + p.w/2, p.y + p.h, "rgba(180,160,140,0.5)", 5, 2);
          sfxPlatformLand();
        }
        p.y = pl.y - p.h; p.vy = 0; p.onGround = true; p.jumpsLeft = p.maxJumps;
      } else if (p.vy < 0 && p.y - p.vy >= pl.y + pl.h - 10) {
        p.y = pl.y + pl.h; p.vy = 0;
      } else if (p.vx > 0) { p.x = pl.x - p.w; p.vx = 0; }
      else if (p.vx < 0) { p.x = pl.x + pl.w; p.vx = 0; }
    }
  });
  
  if (currentRoom === 2 && room2.bombBox && !room2.bombBox.broken) {
    var b = room2.bombBox;
    if (rectHit(p, b)) {
      if (p.vy >= 0 && p.y + p.h - p.vy <= b.y + 10) {
        p.y = b.y - p.h; p.vy = 0; p.onGround = true; p.jumpsLeft = p.maxJumps;
      } else if (p.vx > 0) { p.x = b.x - p.w; p.vx = 0; }
      else if (p.vx < 0) { p.x = b.x + b.w; p.vx = 0; }
    }
  }
  room.walls.forEach(function(w) {
    if (rectHit(p, w)) {
      if (p.vx > 0) { p.x = w.x - p.w; p.vx = 0; }
      else if (p.vx < 0) { p.x = w.x + w.w; p.vx = 0; }
    }
  });
  
  if (p.onGround && p.inv <= 0) {
    if (p === player) {
      var onSpikes = false;
      room.spikes.forEach(function(s) {
        var hit = {x: s.x + 5, y: s.y - 15, w: s.w - 10, h: s.h + 15};
        if (rectHit(p, hit)) onSpikes = true;
      });
      if (!onSpikes) { lastSafeX = p.x; lastSafeY = p.y; }
    }
  }
  
  if (p.inv <= 0) {
    room.spikes.forEach(function(s) {
      var hit = {x: s.x + 5, y: s.y - 15, w: s.w - 10, h: s.h + 15};
      if (rectHit(p, hit)) {
        touchingSpikes = true;
        playerTakeDamage(p, 1);
        if (p === player) { hitFlash = 60; needsRespawn = true; p.x = lastSafeX; p.y = lastSafeY; }
        p.frozen = true;
        p.vx = 0; p.vy = 0;
        spawnParticles(p.x + p.w/2, p.y + p.h, "#f44", 12);
      }
    });
  } else { p.inv--; }
  
  if (p === player && transitionCooldown <= 0) {
    if (room.transitionZone && rectHit(p, room.transitionZone)) {
      startTransition(room.transitionZone.to, "forward");
      return;
    }
  }
  
  if (p.swordSwing > 0) p.swordSwing--;
  if (p.swordCooldown > 0) p.swordCooldown--;
  if (!p.swordSheathed && p.swordSwing <= 0) {
    p.swordSheathTimer--;
    if (p.swordSheathTimer <= 0) p.swordSheathed = true;
  }
  
  if (attackPressed && p.hasSword && p.swordEquipped && p.swordCooldown <= 0 && p.swordSwing <= 0 && !p.frozen) {
    p.swordSwing = 12; p.swordCooldown = 22;
    p.swordSheathed = false;
    p.swordSheathTimer = 180;
    stats.attacks++;
    spawnParticles(p.x + p.w/2 + p.facing * 18, p.y + p.h/2, "#ffd700", 6, 4);
    sfxAttack();
    if (p.id === 1) { tryBreakBombBox(); }
    checkSwordHitEnemiesFor(p);
  }
  
  if (interactPressed) tryInteractFor(p);
  
  if (jumpPressed && p.jumpsLeft > 0 && !p.frozen) {
    p.vy = -14.5; p.jumpsLeft--; p.onGround = false;
    stats.jumps++;
    spawnParticles(p.x + p.w/2, p.y + p.h, "#888", 4);
    sfxJump();
  }
}

function updatePlayer() {
  if (gameState !== ST_PLAYING) return;
  if (transitionCooldown > 0) transitionCooldown--;
  var moveLeft = keys["a"] || keys["arrowleft"];
  var moveRight = keys["d"] || keys["arrowright"];
  var jump = keys[" "] || keys["arrowup"];
  var attack = (keys["x"] || keys["j"]) && hasSword;
  var interact = keys["e"];
  if (gamepadConnected) {
    if (gpAxes.x < -0.25) moveLeft = true;
    if (gpAxes.x > 0.25) moveRight = true;
    if (gpButtons[0] && !prevGPButtons[0]) jump = true;
    if (gpButtons[2] && !prevGPButtons[2]) attack = true;
    if (gpButtons[3] && !prevGPButtons[3]) interact = true;
  }
  updateGenericPlayer(player, moveLeft, moveRight, jump, attack, interact);
}

function updatePlayer2() {
  if (gameState !== ST_PLAYING || !twoPlayerMode) return;
  // Versión simplificada: solo teclas fijas para J2
  var moveLeft = keys["arrowleft"];
  var moveRight = keys["arrowright"];
  var jump = keys["shift"];
  var attack = keys["ctrl"] && hasSword;
  var interact = keys["alt"];
  // Usamos las mismas teclas para J2 (simplificado)
  updateGenericPlayer(player2, moveLeft, moveRight, jump, attack, interact);
  if (rectHit(player, player2)) {
    var dx = (player.x + player.w/2) - (player2.x + player2.w/2);
    if (dx > 0) { player.x += 1; player2.x -= 1; }
    else { player.x -= 1; player2.x += 1; }
  }
}

function checkSwordHitEnemiesFor(p) {
  if (p.swordSwing <= 0) return;
  var swingBox = { x: p.x + (p.facing > 0 ? p.w : -26), y: p.y + 2, w: 26, h: 26 };
  enemies.forEach(function(e) {
    if (e.dead || e.room !== currentRoom) return;
    if (rectHit(swingBox, e)) {
      e.dead = true;
      stats.enemiesKilled++;
      for (var i = 0; i < 15; i++) {
        deathParticles.push({
          x: e.x + e.w/2, y: e.y + e.h/2,
          vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6 - 2,
          life: 20 + Math.random() * 20, maxLife: 30,
          color: ["#f44", "#f88", "#a0a", "#f0f"][Math.floor(Math.random()*4)],
          size: 2 + Math.random() * 4
        });
      }
      var baseGain = e.type === 'larva_mosca' ? 4 : 2;
      var azariGain = hasAzariCharm ? baseGain * 2 : baseGain;
      azari += azariGain;
      bestiary[e.type].count++;
      if (!bestiary[e.type].discovered) {
        bestiary[e.type].discovered = true;
        discoveryNotify = { active: true, timer: 200, name: bestiaryInfo[e.type].name };
        sfxDiscovery();
      }
      spawnParticles(e.x + e.w/2, e.y + e.h/2, "#f88", 12, 5);
      spawnParticles(e.x + e.w/2, e.y + e.h/2, "#440", 8, 3);
      spawnFloatText(e.x, e.y - 10, "¡Muerto!", "#f88");
      spawnFloatText(e.x, e.y - 25, "+" + azariGain + " Azari", "#0ff");
      sfxEnemyDie(); sfxCoin();
    }
  });
}

function tryInteractFor(p) {
  if (currentRoom === 1 && !room1.pedestal.taken) {
    var ped = room1.pedestal;
    var dx = (p.x + p.w/2) - (ped.glass.x + ped.glass.w/2);
    var dy = (p.y + p.h/2) - (ped.glass.y + ped.glass.h/2);
    if (Math.sqrt(dx*dx + dy*dy) < 70) {
      room1.pedestal.taken = true;
      hasSword = true; swordEquipped = true;
      player.hasSword = true; player.swordEquipped = true;
      if (twoPlayerMode) { player2.hasSword = true; player2.swordEquipped = true; }
      flash = 0.6;
      spawnParticles(1180, 470, "#ffd700", 25, 5);
      sfxEquip();
      spawnParticles(1180, 470, "#fff", 15, 4);
      spawnFloatText(1180, 400, "¡Obtuviste la Espada!", "#ffd700");
      spawnFloatText(1180, 420, "Presiona X/J o CTRL para atacar", "#aaa");
      updateUI();
      return;
    }
  }
  var room = rooms[currentRoom];
  if (room.shops) {
    for (var i = 0; i < room.shops.length; i++) {
      var s = room.shops[i];
      var npc = s.npc;
      var dx = (p.x + p.w/2) - (npc.x + npc.w/2);
      var dy = (p.y + p.h/2) - (npc.y + npc.h/2);
      if (Math.sqrt(dx*dx + dy*dy) < 90 && !shopOpen) {
        shopOpen = true; shopId = s.id; menuSelection = 0;
        return;
      }
    }
  }
  if (room.healingStone && room.healingStone.active) {
    var st = room.healingStone;
    var dx = (p.x + p.w/2) - (st.x + st.w/2);
    var dy = (p.y + p.h/2) - (st.y + st.h/2);
    if (Math.sqrt(dx*dx + dy*dy) < 80 && p.hp < p.maxHp && !healing) {
      healing = true; healTimer = 120; p.frozen = true;
      spawnFloatText(p.x, p.y - 30, "J" + p.id + " sentándose...", "#4f4");
    }
  }
}

function tryBreakBombBox() {
  if (currentRoom !== 2 || !room2.bombBox || room2.bombBox.broken || room2.bombBox.exploded) return;
  var swingBox = { x: player.x + (player.facing > 0 ? player.w : -26), y: player.y + 2, w: 26, h: 26 };
  if (rectHit(swingBox, room2.bombBox)) {
    room2.bombBox.broken = true;
    startExplosion();
  }
}

function startExplosion() {
  gameState = ST_EXPLOSION;
  explosionAnim = 60;
  sfxExplosion();
  var box = room2.bombBox;
  explosionX = box.x + box.w/2;
  explosionY = box.y + box.h/2;
  player.frozen = true; player.vx = 0; player.vy = 0;
  if (twoPlayerMode) { player2.frozen = true; player2.vx = 0; player2.vy = 0; }
  spawnParticles(explosionX, explosionY, "#ff6600", 30, 8);
  spawnParticles(explosionX, explosionY, "#ffcc00", 20, 6);
  spawnParticles(explosionX, explosionY, "#ff0000", 15, 10);
}

function updateExplosion() {
  explosionAnim--;
  if (explosionAnim === 45) {
    knockbackVX = 10; knockbackVY = -12;
    player.vx = knockbackVX; player.vy = knockbackVY;
    if (twoPlayerMode) { player2.vx = -knockbackVX; player2.vy = knockbackVY; }
    spawnParticles(explosionX, explosionY, "#ff4400", 25, 12);
    spawnParticles(explosionX, explosionY, "#ffaa00", 20, 10);
    spawnParticles(player.x + player.w/2, player.y + player.h/2, "#ff6600", 10, 5);
    if (twoPlayerMode) spawnParticles(player2.x + player2.w/2, player2.y + player2.h/2, "#ff6600", 10, 5);
  }
  if (explosionAnim < 45 && explosionAnim > 10) {
    player.vx = knockbackVX * (explosionAnim / 45);
    player.vy += GRAVITY;
    player.x += player.vx; player.y += player.vy;
    if (twoPlayerMode) {
      player2.vx = -knockbackVX * (explosionAnim / 45);
      player2.vy += GRAVITY;
      player2.x += player2.vx; player2.y += player2.vy;
    }
    if (explosionAnim % 5 === 0) {
      spawnParticles(explosionX + (Math.random()-0.5)*40, explosionY + (Math.random()-0.5)*40, "#555", 3, 2);
    }
  }
  if (explosionAnim <= 10) { transFade = 1 - (explosionAnim / 10); }
  if (explosionAnim <= 0) { startFallTransition(); }
}

function startFallTransition() {
  gameState = ST_TRANSITION;
  transPhase = "load";
  transTimer = 60;
  transTargetRoom = 3;
  transFade = 1;
  zoneName = "TÚNELES OLVIDADOS";
  zoneNameTimer = 150;
  currentRoom = 3;
  targetCamX = currentRoom * ROOM_W;
  cameraX = targetCamX;
  player.x = 2450; player.y = 400; player.vx = 0; player.vy = 0; player.frozen = false;

  room2.bombBox.exploded = true;
}

function startFallThroughTransition(toRoom) {
  if (gameState === ST_TRANSITION || gameState === ST_EXPLOSION) return;
  gameState = ST_TRANSITION;
  transPhase = "out";
  transTimer = 35;
  transTargetRoom = toRoom;
  transFade = 0;
  transIsFall = true;
  player.vx = 0; player.vy = 0;
  if (twoPlayerMode) { player2.vx = 0; player2.vy = 0; }
}

function startTransition(toRoom, direction) {
  if (gameState === ST_TRANSITION || gameState === ST_EXPLOSION) return;
  sfxTransition();
  particles = [];
  floatTexts = [];
  gameState = ST_TRANSITION;
  transPhase = "out";
  transTimer = 50;
  transTargetRoom = toRoom;
  transFade = 0;
  transIsFall = false;
  player.autoWalk = 50;
  if (twoPlayerMode) player2.autoWalk = 50;
  if (direction === "back") { player.vx = -2; if (twoPlayerMode) player2.vx = -2; }
  else { player.vx = 2; if (twoPlayerMode) player2.vx = 2; }
}

function updateTransition() {
  transTimer--;
  if (transPhase === "out") {
    transFade = 1 - (transTimer / 50);
    player.x += player.vx;
    if (twoPlayerMode) player2.x += player2.vx;
    if (transTimer <= 0) { transPhase = "load"; transTimer = 40; }
  } else if (transPhase === "load") {
    transFade = 1;
    if (transTimer === 25) {
      currentRoom = transTargetRoom;
      var room = rooms[currentRoom];
      if (transIsFall) {
        player.x = currentRoom * ROOM_W + ROOM_W / 2 - player.w / 2 - 20;
        player.y = 80; player.vx = 0; player.vy = 2;
        if (twoPlayerMode) { player2.x = currentRoom * ROOM_W + ROOM_W / 2 - player2.w / 2 + 20; player2.y = 80; player2.vx = 0; player2.vy = 2; }
        spawnFloatText(player.x, player.y + 30, "No hay vuelta atrás...", "#f44");
      } else {
        if (player.vx < 0) {
          player.x = currentRoom * ROOM_W + ROOM_W - 80;
          if (twoPlayerMode) player2.x = currentRoom * ROOM_W + ROOM_W - 50;
        } else {
          player.x = currentRoom * ROOM_W + 30;
          if (twoPlayerMode) player2.x = currentRoom * ROOM_W + 60;
        }
        player.y = room.height - 120;
        player.vx = player.vx < 0 ? -2 : 2;
        if (twoPlayerMode) { player2.y = room.height - 120; player2.vx = player2.vx < 0 ? -2 : 2; }
      }
      var names = ["CAVERNA INICIAL", "CUEVA OLVIDADA", "ASCENSO ROCOSO", "TÚNELES OLVIDADOS", "PROFUNDIDADES", "CIUDAD", "PICO ABISMAL", "CIMA", "CAMINO FINAL", "TIENDA"];
      zoneName = names[currentRoom] || "";
      zoneNameTimer = 120;
    }
    if (transTimer <= 0) { transPhase = "in"; transTimer = transIsFall ? 35 : 50; }
  } else if (transPhase === "in") {
    transFade = transTimer / (transIsFall ? 35 : 50);
    if (transIsFall) {
      player.vy += GRAVITY; if (player.vy > 8) player.vy = 8;
      player.y += player.vy;
      if (twoPlayerMode) { player2.vy += GRAVITY; if (player2.vy > 8) player2.vy = 8; player2.y += player2.vy; }
    } else {
      player.x += player.vx;
      if (twoPlayerMode) player2.x += player2.vx;
    }
    if (transTimer <= 0) { gameState = ST_PLAYING; player.autoWalk = 0; player.vx = 0; if (twoPlayerMode) { player2.autoWalk = 0; player2.vx = 0; } transIsFall = false; transitionCooldown = 45; }
  }
}

/* === RENDERER === */
function drawCaveBg(rx, decor, roomH) {
  ctx.fillStyle = "#080818";
  ctx.fillRect(rx, 0, ROOM_W, roomH);
  for (var i = 0; i < 20; i++) {
    var sx = rx + (i * 137) % ROOM_W, sy = (i * 89) % roomH;
    ctx.globalAlpha = 0.1 + Math.sin(Date.now()/2000 + i) * 0.05;
    ctx.fillStyle = "#fff"; ctx.fillRect(sx, sy, 1, 1);
  }
  ctx.globalAlpha = 1;
  decor.forEach(function(d) {
    if (d.type === 'stalactite') {
      ctx.fillStyle = "#1a1a2e";
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + d.w/2, d.y + d.h);
      ctx.lineTo(d.x + d.w, d.y);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#2a2a3e";
      ctx.fillRect(d.x + d.w/2 - 1, d.y, 2, d.h * 0.7);
    } else if (d.type === 'rock') {
      ctx.fillStyle = "#151525";
      ctx.beginPath();
      ctx.moveTo(d.x, d.y + d.h);
      ctx.lineTo(d.x + d.w/2, d.y);
      ctx.lineTo(d.x + d.w, d.y + d.h);
      ctx.closePath();
      ctx.fill();
    } else if (d.type === 'wall') {
      ctx.fillStyle = "#0f0f1a";
      ctx.fillRect(d.x, d.y, d.w, d.h);
      ctx.fillStyle = "#1a1a28";
      ctx.fillRect(d.x + 2, d.y + 2, d.w - 4, d.h - 4);
    }
  });
}

function drawPlatforms(room) {
  room.platforms.forEach(function(p) {
    ctx.fillStyle = "#2a2a3a";
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = "#3a3a4a";
    ctx.fillRect(p.x, p.y, p.w, 3);

}

function drawSpikes(room) {

      ctx.lineTo(s.x + i + 6, s.y);
      ctx.lineTo(s.x + i + 12, s.y + s.h);

}

function drawEnemies() {
  var camLeft = cameraX, camRight = cameraX + 800, camTop = cameraY, camBottom = cameraY + 600;
  enemies.forEach(function(e) {
    if (e.dead || e.room !== currentRoom) return;
    if (e.x + e.w < camLeft - 50 || e.x > camRight + 50) return;
    if (e.y + e.h < camTop - 50 || e.y > camBottom + 50) return;
    ctx.save();
    if (e.type === 'larva_mosca') {
      var wiggle = Math.sin(Date.now()/100) * 3;
      ctx.fillStyle = "#6a4";
      ctx.beginPath(); ctx.ellipse(e.x+e.w/2, e.y+e.h/2+4, e.w/2, e.h/2.5, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#8c6";
      ctx.beginPath(); ctx.ellipse(e.x+e.w/2, e.y+e.h/2+2, e.w/2-2, e.h/2.5-2, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#4a3"; ctx.fillRect(e.x+4, e.y+12, 4, 4); ctx.fillRect(e.x+12, e.y+14, 4, 4); ctx.fillRect(e.x+20, e.y+12, 4, 4);
      ctx.fillStyle = "#f00"; ctx.fillRect(e.x+6, e.y+4, 4, 4); ctx.fillRect(e.x+16, e.y+4, 4, 4);
      ctx.fillStyle = "#300"; ctx.fillRect(e.x+7, e.y+5, 2, 2); ctx.fillRect(e.x+17, e.y+5, 2, 2);
      ctx.fillStyle = "rgba(180,220,255,0.3)";
      ctx.beginPath(); ctx.ellipse(e.x-2+wiggle, e.y+6, 8, 12, -0.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(e.x+e.w+2-wiggle, e.y+6, 8, 12, 0.3, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = "rgba(200,240,255,0.4)"; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.ellipse(e.x-2+wiggle, e.y+6, 8, 12, -0.3, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(e.x+e.w+2-wiggle, e.y+6, 8, 12, 0.3, 0, Math.PI*2); ctx.stroke();
    } else {
      var flap = Math.sin(Date.now() / 80) * 6;
      ctx.fillStyle = "#663399";
      ctx.beginPath(); ctx.ellipse(e.x + e.w/2, e.y + e.h/2, e.w/2, e.h/2.5, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#442266";
      ctx.beginPath();
      ctx.moveTo(e.x + e.w/2, e.y + 4);
      ctx.lineTo(e.x - 4, e.y + flap + 4);
      ctx.lineTo(e.x + e.w/2, e.y + e.h/2);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(e.x + e.w/2, e.y + 4);
      ctx.lineTo(e.x + e.w + 4, e.y + flap + 4);
      ctx.lineTo(e.x + e.w/2, e.y + e.h/2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ff2244";
      ctx.fillRect(e.x + 5, e.y + 6, 4, 4);
      ctx.fillRect(e.x + 14, e.y + 6, 4, 4);
    }
    ctx.restore();
  });
}

function drawPlayerEntity(p) {
  ctx.save();
  if (p.inv > 0 && p === player) {
    var alpha = p.inv / 40 * 0.6;
    ctx.fillStyle = "rgba(0,0,0," + alpha + ")";
    ctx.fillRect(p.x, p.y, p.w, p.h);
    if (Math.floor(p.inv / 4) % 2 === 0) ctx.globalAlpha = 0.3;
  }
  if (p.inv > 0 && Math.floor(p.inv/4)%2 === 0) ctx.globalAlpha = 0.3;
  
  ctx.fillStyle = "#0a0a2a";
  ctx.fillRect(p.x+4, p.y+8, p.w-8, p.h-8);
  ctx.fillStyle = p.color;
  ctx.fillRect(p.x+5, p.y+10, p.w-10, p.h-12);
  ctx.fillStyle = p.headColor;
  ctx.fillRect(p.x+5, p.y+2, p.w-10, 7);
  ctx.fillStyle = "#fff";
  var eyeX = p.facing > 0 ? p.x+12 : p.x+6;
  ctx.fillRect(eyeX, p.y+4, 2.5, 2.5);
  
  if (p.hasSword && p.swordEquipped && !p.swordSheathed) {
    var sx = p.x+p.w/2, sy = p.y+p.h/2, angle = p.facing > 0 ? 0.3 : 2.8;
    if (p.swordSwing > 0) {
      var pr = 1-(p.swordSwing/12);
      angle = (p.facing>0?-0.5:-2.5)+pr*(p.facing>0?2.5:2.5);
    }
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(angle);
    ctx.fillStyle = "#ddd"; ctx.fillRect(0, -2.5, 26, 5);
    ctx.fillStyle = "#fff"; ctx.fillRect(2, -1, 20, 1.5);
    ctx.fillStyle = "#d4af37"; ctx.fillRect(-2, -5, 5, 10);
    ctx.fillStyle = "#5a3010"; ctx.fillRect(-7, -2, 7, 3);
    ctx.restore();
  }
  ctx.restore();
}

function drawInventory() {

function drawGameWorld() {
  ctx.fillStyle = "#050510"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (flash > 0) { ctx.fillStyle = "rgba(255,255,255," + (flash*0.3) + ")"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  ctx.save(); ctx.translate(-Math.floor(cameraX), -Math.floor(cameraY));
  
  ctx.fillStyle = "#0a0a1a";
  for (var i = 0; i < 30; i++) {
    var bx = ((i * 173) % 8000), by = 50 + Math.sin(i * 2.3) * 100;
    ctx.globalAlpha = 0.03;
    ctx.beginPath(); ctx.arc(bx, by, 60 + Math.sin(i)*30, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#fff";
  for (var i = 0; i < 60; i++) {
    var sx = (i*137)%8000, sy = (i*89)%2000;
    ctx.globalAlpha = 0.05 + Math.sin(Date.now()/1000+i)*0.03;
    ctx.fillRect(sx, sy, 1.2, 1.2);
  }
  ctx.globalAlpha = 1;
  
  stalactites.forEach(function(s) {
    if (s.fallen || !s.active) return;
    if (Math.floor(s.x / ROOM_W) !== currentRoom) return;
    var grad = ctx.createLinearGradient(s.x, s.y, s.x, s.y + s.h);
    grad.addColorStop(0, "rgba(150,150,170,0.8)");
    grad.addColorStop(0.5, "rgba(100,100,120,0.6)");
    grad.addColorStop(1, "rgba(60,60,70,0.4)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + s.w/2, s.y + s.h);
    ctx.lineTo(s.x + s.w, s.y);
    ctx.closePath();
    ctx.fill();
  });
  
  var camLeft = cameraX, camRight = cameraX + 800, camTop = cameraY, camBottom = cameraY + 600;
  for (var r = 0; r < rooms.length; r++) {
    var rx = r * ROOM_W;
    if (rx + ROOM_W < camLeft - 100 || rx > camRight + 100) continue;
    var room = rooms[r];
    if (room.height < camTop - 100 || 0 > camBottom + 100) continue;
    drawCaveBg(rx, room.decor, room.height);
    drawPlatforms(room);
    drawSpikes(room);
    if (r === 1) drawPedestal();
    if (r === 2) drawBombBox();
    if (r === 5) drawTransitionZone(room5.transitionZone);
    if (r === 9) { drawShopNPC(); drawHealingStone(); }
  }
  drawEnemies();
  drawPlayerEntity(player);
  if (twoPlayerMode) drawPlayerEntity(player2);
  
  deathParticles.forEach(function(p) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
  
  particles.forEach(function(p) { ctx.globalAlpha = Math.max(0, p.life/p.maxLife); ctx.fillStyle = p.color; ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size); });
  ctx.globalAlpha = 1;
  floatTexts.forEach(function(t) { ctx.globalAlpha = Math.max(0, t.life/70); ctx.fillStyle = t.color; ctx.font = "bold 13px monospace"; ctx.fillText(t.text, t.x, t.y); });
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawHpBar(p, barX, barY) {
  var segW = 14, segH = 10, gap = 1;
  ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(barX - 4, barY - 4, (segW + gap) * p.maxHp + 6, segH + 8);
  ctx.strokeStyle = p.id === 2 ? "#f4f" : "#f44"; ctx.lineWidth = 1; ctx.strokeRect(barX - 4, barY - 4, (segW + gap) * p.maxHp + 6, segH + 8);
  for (var i = 0; i < p.maxHp; i++) {
    if (i < p.hp) {
      ctx.fillStyle = p.id === 2 ? "#ff33ff" : "#ff3344";
      ctx.fillRect(barX + i * (segW + gap), barY, segW, segH);
      ctx.fillStyle = p.id === 2 ? "#ff77ff" : "#ff6677";
      ctx.fillRect(barX + i * (segW + gap), barY, segW, 3);
    } else {
      ctx.fillStyle = p.id === 2 ? "#331133" : "#331111";
      ctx.fillRect(barX + i * (segW + gap), barY, segW, segH);
      ctx.strokeStyle = p.id === 2 ? "#441144" : "#441111"; ctx.lineWidth = 0.5;
      ctx.strokeRect(barX + i * (segW + gap), barY, segW, segH);
    }
  }
}

function drawExplosion() {
  drawGameWorld();
  var flashIntensity = 0;
  if (explosionAnim > 40) flashIntensity = (explosionAnim - 40) / 20;
  else if (explosionAnim > 20) flashIntensity = 0.8;
  else flashIntensity = explosionAnim / 25;
  ctx.fillStyle = "rgba(255, " + (100 + explosionAnim) + ", 0, " + (flashIntensity * 0.5) + ")";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  var radius = (60 - explosionAnim) * 4;
  ctx.strokeStyle = "rgba(255, " + (explosionAnim * 4) + ", 0, " + (explosionAnim / 60) + ")";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(explosionX - cameraX, explosionY - cameraY, radius, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = "rgba(255, 200, 0, " + (explosionAnim / 80) + ")";
  ctx.beginPath(); ctx.arc(explosionX - cameraX, explosionY - cameraY, radius * 0.7, 0, Math.PI*2); ctx.stroke();
  if (explosionAnim <= 15) {
    ctx.fillStyle = "rgba(0, 0, 0, " + (1 - explosionAnim / 15) + ")";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  if (explosionAnim <= 20) {
    ctx.fillStyle = "#fff";
    ctx.font = "bold 14px monospace";
    ctx.textAlign = "center";
    ctx.fillText("CARGANDO", canvas.width/2, 30);
    ctx.textAlign = "left";
  }
}

  player.hasSword = false; player.swordEquipped = false;
  if (twoPlayerMode) { player2.hasSword = false; player2.swordEquipped = false; }
  azari = 0; hasMap = false; shopOpen = false; shopId = 0;
  heartFragments1 = 0; heartFragments2 = 0;
  heartFragmentsBought1 = 0; heartFragmentsBought2 = 0;
  hasAzariCharm = false; hasDoubleJump = false;
  hitFlash = 0; needsRespawn = false;
  player.hp = player.maxHp = 10;
  if (twoPlayerMode) player2.hp = player2.maxHp = 10;
  stats = { playTime: 0, enemiesKilled: 0, roomsVisited: 1, jumps: 0, attacks: 0, deaths: 0 };
  frameCounter = 0;
  bestiary = { bat: { discovered: false, count: 0 }, larva_mosca: { discovered: false, count: 0 } };
  deathParticles = [];
  playerDead = false; deathTimer = 0;
  room0.transitionZone = null; room1.transitionZone = null; room2.transitionZone = null;
  room3.transitionZone = null; room4.transitionZone = null;
  room5.transitionZone = {x:4750, y:460, w:50, h:100, to:6};
  room6.transitionZone = null; room7.transitionZone = null; room8.transitionZone = null; room9.transitionZone = null;
  room1.pedestal.taken = false; room1.pedestal.glow = 0;
  if (room2.bombBox) { room2.bombBox.broken = false; room2.bombBox.exploded = false; }
  if (room9.healingStone) room9.healingStone.active = true;
  enemies.forEach(function(e){ e.dead = false; });
  generateStalactites();
}

function update() {
  if (shopOpen) return;
  if (gameState === ST_EXPLOSION) { updateExplosion(); return; }
  if (gameState === ST_TRANSITION) { updateTransition(); return; }
  if (hitFlash > 0) {
    hitFlash--;
    if (hitFlash <= 0 && needsRespawn) {
      needsRespawn = false;
      player.frozen = false;
      player.x = lastSafeX; player.y = lastSafeY;
      player.vx = -player.facing * 4; player.vy = -5;
    }
    return;
  }
  if (gameState !== ST_PLAYING && gameState !== ST_INVENTORY) return;
  
  if (gameState === ST_PLAYING) {
    frameCounter++;
    if (frameCounter >= 60) { frameCounter = 0; stats.playTime++; }
    updateStalactites();
    for (var i = deathParticles.length - 1; i >= 0; i--) {
      var dp = deathParticles[i];
      dp.x += dp.vx; dp.y += dp.vy; dp.vy += 0.1; dp.life--;
      if (dp.life <= 0) deathParticles.splice(i, 1);
    }
  }
  
  var room = rooms[currentRoom];
  
  if (twoPlayerMode) {
    var midX = (player.x + player.w/2 + player2.x + player2.w/2) / 2;
    targetCamX = midX - canvas.width/2;
  } else {
    targetCamX = player.x + player.w/2 - canvas.width/2;
  }
  targetCamX = Math.max(0, Math.min(targetCamX, WORLD_W - canvas.width));
  var diff = targetCamX - cameraX; cameraX += diff * 0.08; if (Math.abs(diff) < 0.5) cameraX = targetCamX;
  
  if (room.height > canvas.height) {
    if (twoPlayerMode) {
      var midY = (player.y + player.h/2 + player2.y + player2.h/2) / 2;
      targetCamY = midY - canvas.height/2;
    } else {
      targetCamY = player.y + player.h/2 - canvas.height/2;
    }
    targetCamY = Math.max(0, Math.min(targetCamY, room.height - canvas.height));
  } else { targetCamY = 0; }
  var diffY = targetCamY - cameraY; cameraY += diffY * 0.08; if (Math.abs(diffY) < 0.5) cameraY = targetCamY;
  
  if (gameState === ST_PLAYING) {
    updatePlayer();
    updatePlayer2();
    updateEnemies();
    if (healing) {
      healTimer--;
      if (healTimer % 20 === 0) {
        if (player.hp < player.maxHp) { player.hp++; spawnParticles(player.x + player.w/2, player.y - 5, "#4f4", 3, 2); sfxHeal(); }
        if (twoPlayerMode && player2.hp < player2.maxHp) { player2.hp++; spawnParticles(player2.x + player2.w/2, player2.y - 5, "#f4f", 3, 2); sfxHeal(); }
      }
      if (healTimer <= 0 || (player.hp >= player.maxHp && (!twoPlayerMode || player2.hp >= player2.maxHp))) {
        healing = false; player.frozen = false; if (twoPlayerMode) player2.frozen = false;
        spawnFloatText(player.x, player.y - 30, "¡Vida restaurada!", "#4f4");
      }
    }
    for (var i = particles.length - 1; i >= 0; i--) { var p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life--; if (p.life <= 0) particles.splice(i, 1); }
    for (var i = floatTexts.length - 1; i >= 0; i--) { var t = floatTexts[i]; t.y += t.vy; t.life--; if (t.life <= 0) floatTexts.splice(i, 1); }
    if (zoneNameTimer > 0) zoneNameTimer--;
    if (flash > 0) flash -= 0.025;
    if (discoveryNotify.active) {
      discoveryNotify.timer--;
      if (discoveryNotify.timer <= 0) discoveryNotify.active = false;
    }
  }
}

function loop() {
  update();
  if (gameState === ST_MENU) drawMenu();
  else if (gameState === ST_PAUSED) { drawGame(); drawPause(); }
  else if (gameState === ST_TRANSITION) drawTransition();
  else if (gameState === ST_EXPLOSION) drawExplosion();
  else if (gameState === ST_INVENTORY) { drawGame(); drawInventory(); }
  else {
    drawGame();
    if (shopOpen) drawShop();
  }
  requestAnimationFrame(loop);
}

/* === EVENTOS === */
document.addEventListener("keydown", function(e) {
  initAudio();
  var k = e.key.toLowerCase();
  
  if (k === "`") {
    if (gameState === ST_PLAYING) {
      inventoryOpen = !inventoryOpen;
      if (inventoryOpen) gameState = ST_INVENTORY;
      else gameState = ST_PLAYING;
      e.preventDefault();
      return;
    } else if (gameState === ST_INVENTORY) {
      inventoryOpen = false;
      gameState = ST_PLAYING;
      e.preventDefault();
      return;
    }
  }
  
  if (e.key === "Escape") {
    if (gameState === ST_PLAYING) {
      gameState = ST_PAUSED; pauseSubState = "menu"; pauseSelection = 0;
      e.preventDefault();
      return;
    } else if (gameState === ST_PAUSED) {
      if (pauseSubState === "diary") pauseSubState = "menu";
      else if (pauseSubState === "controls") pauseSubState = "menu";
      else gameState = ST_PLAYING;
      e.preventDefault();
      return;
    } else if (gameState === ST_INVENTORY) {
      inventoryOpen = false;
      gameState = ST_PLAYING;
      e.preventDefault();
      return;
    } else if (gameState === ST_MENU && menuSubState === "confirm_delete") {
      menuSubState = "slots"; slotToDelete = -1;
      e.preventDefault();
      return;
    } else if (shopOpen) {
      shopOpen = false; menuSelection = 0;
      e.preventDefault();
      return;
    }
  }
  
  if (gameState === ST_MENU) {
    if (menuSubState === "slots") {
      if (e.key === "ArrowUp" || k === "w") { menuSelection = (menuSelection - 1 + 5) % 5; e.preventDefault(); return; }
      if (e.key === "ArrowDown" || k === "s") { menuSelection = (menuSelection + 1) % 5; e.preventDefault(); return; }
      if (e.key === "Enter") {
        activeSlot = menuSelection;
        var saves = getSaves();
        if (saves.slots[menuSelection]) {
          if (loadGame(menuSelection)) { gameState = ST_PLAYING; updateUI(); }
        } else {
          resetAll(); gameState = ST_PLAYING; updateUI();
        }
        e.preventDefault();
        return;
      }
      if (k === "delete" || k === "x") {
        if (getSaves().slots[menuSelection]) { menuSubState = "confirm_delete"; slotToDelete = menuSelection; }
        e.preventDefault();
        return;
      }
    } else if (menuSubState === "confirm_delete") {
      if (k === "y" || k === "s") { deleteSave(slotToDelete); menuSubState = "slots"; slotToDelete = -1; e.preventDefault(); return; }
      if (k === "n" || e.key === "Escape") { menuSubState = "slots"; slotToDelete = -1; e.preventDefault(); return; }
    }
    return;
  }
  
  if (gameState === ST_PAUSED) {
    if (pauseSubState === "diary") return;
    if (pauseSubState === "controls") { if (e.key === "Escape") { pauseSubState = "menu"; e.preventDefault(); } return; }
    if (e.key === "ArrowUp" || k === "w") { pauseSelection = (pauseSelection - 1 + 5) % 5; e.preventDefault(); return; }
    if (e.key === "ArrowDown" || k === "s") { pauseSelection = (pauseSelection + 1) % 5; e.preventDefault(); return; }
    if (e.key === "Enter") {
      if (pauseSelection === 0) gameState = ST_PLAYING;
      if (pauseSelection === 1) pauseSubState = "diary";
      if (pauseSelection === 2) { twoPlayerMode = !twoPlayerMode; updateUI(); }
      if (pauseSelection === 3) { pauseSubState = "controls"; }
      if (pauseSelection === 4) { if (activeSlot >= 0) saveGame(activeSlot); gameState = ST_MENU; menuSubState = "slots"; }
      e.preventDefault();
      return;
    }
    if (k === "q") { if (activeSlot >= 0) saveGame(activeSlot); gameState = ST_MENU; menuSubState = "slots"; e.preventDefault(); return; }
    return;
  }
  
  if (gameState === ST_PLAYING) {
    if (e.key === "a" || e.key === "A") { keys["a"] = true; e.preventDefault(); }
    if (e.key === "d" || e.key === "D") { keys["d"] = true; e.preventDefault(); }
    if (e.key === "ArrowLeft") { keys["arrowleft"] = true; e.preventDefault(); }
    if (e.key === "ArrowRight") { keys["arrowright"] = true; e.preventDefault(); }
    if (e.key === " " || e.key === "Space") { keys[" "] = true; e.preventDefault(); }
    if (e.key === "ArrowUp") { keys["arrowup"] = true; e.preventDefault(); }
    if (e.key === "x" || e.key === "X" || e.key === "j" || e.key === "J") { keys["x"] = true; e.preventDefault(); }
    if (e.key === "e" || e.key === "E") { keys["e"] = true; e.preventDefault(); }
    if (e.key === "m" || e.key === "M") { initAudio(); toggleMusic(); e.preventDefault(); }
    if (e.key === "n" || e.key === "N") { initAudio(); toggleSfx(); e.preventDefault(); }
  }
  
  if (shopOpen) {
    if (shopId === 0 && e.key === "Enter" && !hasMap && azari >= 45) {
      azari -= 45; hasMap = true;
      spawnFloatText(player.x, player.y - 30, "¡Mapa adquirido!", "#ffd700");
      sfxBuy();
    }
    if (shopId === 1) {
      if (e.key === "ArrowUp" || k === "w") { menuSelection = (menuSelection - 1 + 2) % 2; e.preventDefault(); return; }
      if (e.key === "ArrowDown" || k === "s") { menuSelection = (menuSelection + 1) % 2; e.preventDefault(); return; }
      if (e.key === "Enter") {
        if (menuSelection === 0 && heartFragmentsBought1 < 2 && azari >= 25) {
          azari -= 25; heartFragments1++; heartFragmentsBought1++;
          spawnFloatText(player.x, player.y - 30, "¡Fragmento J1!", "#f44");
          sfxBuy();
          if (heartFragments1 >= 3) { heartFragments1 -= 3; player.maxHp++; player.hp = player.maxHp; spawnFloatText(player.x, player.y - 50, "¡Vida +1!", "#f44"); spawnParticles(player.x + player.w/2, player.y + player.h/2, "#f44", 20, 5); }
        }
        if (menuSelection === 1 && !hasAzariCharm && azari >= 45) { azari -= 45; hasAzariCharm = true; spawnFloatText(player.x, player.y - 30, "¡Amuleto!", "#0ff"); sfxBuy(); }
        e.preventDefault(); return;
      }
    }
    if (shopId === 2) {
      if (e.key === "ArrowUp" || k === "w") { menuSelection = (menuSelection - 1 + 2) % 2; e.preventDefault(); return; }
      if (e.key === "ArrowDown" || k === "s") { menuSelection = (menuSelection + 1) % 2; e.preventDefault(); return; }
      if (e.key === "Enter") {
        if (menuSelection === 0 && heartFragmentsBought2 < 2 && azari >= 25) {
          azari -= 25; heartFragments2++; heartFragmentsBought2++;
          spawnFloatText(player2.x, player2.y - 30, "¡Fragmento J2!", "#f4f");
          sfxBuy();
          if (heartFragments2 >= 3) { heartFragments2 -= 3; player2.maxHp++; player2.hp = player2.maxHp; spawnFloatText(player2.x, player2.y - 50, "¡Vida +1!", "#f4f"); spawnParticles(player2.x + player2.w/2, player2.y + player2.h/2, "#f4f", 20, 5); }
        }
        if (menuSelection === 1 && !hasAzariCharm && azari >= 45) { azari -= 45; hasAzariCharm = true; spawnFloatText(player.x, player.y - 30, "¡Amuleto!", "#0ff"); sfxBuy(); }
        e.preventDefault(); return;
      }
    }
    if (e.key === "Escape") { shopOpen = false; menuSelection = 0; e.preventDefault(); return; }
  }
});

document.addEventListener("keyup", function(e) {
  if (e.key === "a" || e.key === "A") keys["a"] = false;
  if (e.key === "d" || e.key === "D") keys["d"] = false;
  if (e.key === "ArrowLeft") keys["arrowleft"] = false;
  if (e.key === "ArrowRight") keys["arrowright"] = false;
  if (e.key === " " || e.key === "Space") keys[" "] = false;
  if (e.key === "ArrowUp") keys["arrowup"] = false;
  if (e.key === "x" || e.key === "X" || e.key === "j" || e.key === "J") keys["x"] = false;
  if (e.key === "e" || e.key === "E") keys["e"] = false;
});

/* === GAMEPAD === */
function scanGamepads() {
  try {
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    var found = false;
    for (var i = 0; i < pads.length; i++) {
      var gp = pads[i];
      if (gp && gp.connected && !found) {
        if (!gamepadConnected || gamepadIndex !== i) {
          gamepadConnected = true; gamepadIndex = i;
          spawnFloatText(player.x || 100, (player.y || 400) - 40, "🎮 Mando detectado", "#0f0");
          updateUI();
        }
        found = true;
      }
    }
    if (!found && gamepadConnected) {
      gamepadConnected = false; gamepadIndex = -1;
      gpButtons = {}; gpAxes = {x:0,y:0};
      updateUI();
    }
  } catch(e) {}
}

function pollGamepad() {
  if (gamepadConnected && gamepadIndex >= 0) {
    var gp = navigator.getGamepads()[gamepadIndex];
    if (gp) {
      var deadzone = 0.25;
      var ax = gp.axes[0] || 0; if (Math.abs(ax) < deadzone) ax = 0;
      gpAxes.x = ax;
      var ay = gp.axes[1] || 0; if (Math.abs(ay) < deadzone) ay = 0;
      gpAxes.y = ay;
      prevGPButtons = {};
      for (var k in gpButtons) prevGPButtons[k] = gpButtons[k];
      gpButtons = {};
      for (var i = 0; i < gp.buttons.length; i++) gpButtons[i] = gp.buttons[i].pressed;
    }
  }
}

function processGamepadInput() {
  if (!gamepadConnected) return;
  var btn9 = gpButtons[9] && !prevGPButtons[9];
  var btn8 = gpButtons[8] && !prevGPButtons[8];
  if (btn8) {
    if (gameState === ST_PLAYING) { inventoryOpen = !inventoryOpen; if (inventoryOpen) gameState = ST_INVENTORY; else gameState = ST_PLAYING; return; }
    else if (gameState === ST_INVENTORY) { inventoryOpen = false; gameState = ST_PLAYING; return; }
  }
  if (btn9) {
    if (gameState === ST_PLAYING) { gameState = ST_PAUSED; pauseSubState = "menu"; pauseSelection = 0; return; }
    else if (gameState === ST_PAUSED) { if (pauseSubState === "diary") pauseSubState = "menu"; else if (pauseSubState === "controls") pauseSubState = "menu"; else gameState = ST_PLAYING; return; }
    else if (gameState === ST_INVENTORY) { inventoryOpen = false; gameState = ST_PLAYING; return; }
  }
}

/* === INICIALIZACIÓN === */
canvas = document.getElementById("gameCanvas");
ctx = canvas.getContext("2d");
resetAll();
loop();

</script>
